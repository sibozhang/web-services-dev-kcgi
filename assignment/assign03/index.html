<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cv-container">
        <aside class="dashboard">
            <div class="dashboard-header">
                <h2>User Input Console</h2>
            </div>
            <form id="userForm">
                <div class="form-group">
                    <label for="input-name">Name:</label>
                    <input type="text" id="input-name" placeholder="Enter name" required />
                </div>
                <div class="form-group">
                    <label for="input-email">Email:</label>
                    <input type="email" id="input-email" placeholder="Enter email" required />
                </div>
                <div class="form-group">
                    <label for="input-phone">Phone:</label>
                    <input type="tel" id="input-phone" placeholder="Enter phone" />
                </div>
                <button type="submit" class="btn-submit">Submit to DB</button>
            </form>
        </aside>

        <main class="cv-content">
            <h2 style="color: var(--primary-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px;">Server Response</h2>
            <pre id="output">Waiting for submission...</pre>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
